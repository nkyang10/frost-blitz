<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Frost Blitz ❄️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- Menu -->
    <div id="menu" class="overlay">
      <div class="menu-bg"><img src="textures/menu_background.png" alt="" /></div>
      <div class="panel">
        <div class="logo-wrap"><img src="textures/logo_frost_blitz.png" alt="Frost Blitz" class="logo-img" onerror="this.style.display='none'" /></div>
        <h1 class="title-text">Frost Blitz ❄️</h1>
        <p class="tagline">滑動雪人砲塔，掟雪球拆豬堡！</p>
        <div id="level-select" class="level-grid"></div>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-item" id="ammo">❄ x0</div>
        <div class="hud-item" id="pigs">🐷 x0</div>
        <button id="menu-btn" class="icon-btn">☰</button>
      </div>
      <div class="slide-bar-wrap">
        <div id="slide-bar">
          <div id="slide-knob"></div>
        </div>
        <div class="slide-labels"><span>0°</span><span>90°</span><span>180°</span><span>270°</span><span>360°</span></div>
      </div>
      <div class="power-wrap">
        <div id="power"><div id="power-fill"></div></div>
        <div class="power-label">CHARGING</div>
      </div>
    </div>

    <!-- Result -->
    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title">勝利！</h2>
        <div id="result-stars" class="stars">⭐⭐⭐</div>
        <p id="result-sub"></p>
        <div class="result-btns">
          <button id="restart-btn" class="btn">再嚟一次</button>
          <button id="next-btn" class="btn primary">下一關</button>
        </div>
        <button id="menu-btn2" class="btn ghost">主選單</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
